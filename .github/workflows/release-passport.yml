# .github/workflows/release-passport.yml
# Build -> push -> scan the pushed digest with Trivy -> ask Release Passport for a passport.
# Authentication is GitHub's own short-lived OIDC token: there is no secret to create or rotate.
name: release-passport

on:
  push:
    branches: [master]   # runs on the default branch maintain the baseline (existing risk)
  pull_request:             # pull requests are judged on the NEW risk they introduce
  workflow_dispatch:

permissions:
  contents: read
  packages: write           # push the image to ghcr.io
  id-token: write           # lets the job request an OIDC token for Release Passport

env:
  PASSPORT_API: https://func-releaseguard-e2a10c.azurewebsites.net
  PASSPORT_PROJECT: prj_b7e233c1faa0
  PASSPORT_AUDIENCE: release-passport
  PASSPORT_CLI_URL: https://agreeable-sea-0e4635c03.2.azurestaticapps.net/cli/passport.py
  TRIVY_IMAGE: aquasec/trivy:0.58.1   # pin, and bump deliberately

jobs:
  passport:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}      # registry/repo@sha256:... for a deploy job
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Which checks are enabled (the dashboard decides, not this file)
        run: |
          curl -fsSL "$PASSPORT_CLI_URL" -o passport.py
          python3 passport.py stages >> "$GITHUB_ENV"

      # Does this repository produce an image at all? A repository holding only infrastructure
      # code, or one whose image is built elsewhere, has nothing to build here.
      - name: Is there an image to build
        id: img
        run: |
          if [ -n "${PASSPORT_IMAGE:-}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"      # the dashboard names the image to judge
          elif [ -f Dockerfile ] || [ -f dockerfile ] || [ -f docker/Dockerfile ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"      # nothing to build: checks still run
            echo "::notice::No Dockerfile found and no image named in Release Passport, so no image is built or scanned."
          fi

      - uses: docker/login-action@v3
        if: steps.img.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        if: steps.img.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # The reference being judged: the image named in the dashboard, or the one just built.
      - name: Image reference
        id: ref
        run: |
          if [ -n "${PASSPORT_IMAGE:-}" ]; then
            echo "image=$PASSPORT_IMAGE" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.img.outputs.build }}" = "true" ]; then
            echo "image=$IMAGE@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      # Skipped when Image security is switched off in the dashboard. Without this scan the
      # passport rests on the pipeline identity and the digest alone, which the run records.
      - name: Image security (Trivy, operating-system packages)
        if: env.PASSPORT_STAGE_IMAGE == '1' && steps.ref.outputs.image != ''
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image \
            --cache-dir /work/.trivycache --scanners vuln --pkg-types os \
            --format json --output trivy.json "${{ steps.ref.outputs.image }}"

      # Dependencies: Trivy by default. Choose OWASP Dependency-Check in the dashboard and run
      # the step below instead; any other scanner can send SARIF (--stage-report sca=report.sarif).
      - name: Dependencies (Trivy, application libraries)
        if: env.PASSPORT_STAGE_SCA == '1' && env.PASSPORT_SCANNER_SCA == 'trivy' && steps.ref.outputs.image != ''
        continue-on-error: true   # a broken scanner is reported on the run, not hidden here
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            -v "$PWD:/work" -w /work "$TRIVY_IMAGE" image \
            --cache-dir /work/.trivycache --scanners vuln --pkg-types library \
            --format json --output trivy-sca.json "${{ steps.ref.outputs.image }}"

      - name: Secret detection (Gitleaks)
        if: env.PASSPORT_STAGE_SECRETS == '1'
        continue-on-error: true   # a broken scanner is reported on the run, not hidden here
        run: |
          # 'dir' scans the files as they are now. 'detect' would only look at commit history,
          # which a shallow checkout truncates to one commit, so a secret committed earlier is missed.
          curl -fsSL "${PASSPORT_CLI_URL%/*}/gitleaks.toml" -o gitleaks.toml
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.21.2 dir . -c gitleaks.toml \
            --report-format json --report-path gitleaks.json --no-banner --exit-code 0

      - name: Code analysis (Semgrep)
        if: env.PASSPORT_STAGE_SAST == '1'
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/semgrep-home"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -v "$RUNNER_TEMP/semgrep-home:/sghome" -w /src \
            -e HOME=/sghome -e SEMGREP_SETTINGS_FILE=/sghome/settings.yml \
            semgrep/semgrep:1.97.0 semgrep scan --config p/default --json --output semgrep.json --quiet --metrics=off

      - name: Dependencies (OWASP Dependency-Check)
        if: env.PASSPORT_STAGE_SCA == '1' && env.PASSPORT_SCANNER_SCA == 'dependency-check'
        continue-on-error: true   # a broken scanner is reported on the run, not hidden here
        run: |
          mkdir -p dc-report dc-data
          # NVD_API_KEY is optional but makes the first run far quicker
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -v "$PWD/dc-data:/usr/share/dependency-check/data" \
            -v "$PWD/dc-report:/report" \
            owasp/dependency-check:10.0.4 \
            --scan /src --format JSON --out /report --project "${{ github.repository }}" \
            ${NVD_API_KEY:+--nvdApiKey "$NVD_API_KEY"} || true
          cp dc-report/dependency-check-report.json depcheck.json 2>/dev/null || true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Infrastructure as code (Checkov)
        if: env.PASSPORT_STAGE_IAC == '1'
        continue-on-error: true   # a broken scanner is reported on the run, not hidden here
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/tf" -w /tf \
            bridgecrew/checkov:3.2.334 -d . --output json --quiet --compact > checkov.json || true

      # With no image, --image is left out and the commit is what gets judged.
      - name: Request release passport
        run: |
          IMAGE_ARG=""
          [ -n "${{ steps.ref.outputs.image }}" ] && IMAGE_ARG='--image ${{ steps.ref.outputs.image }}'
          # shellcheck disable=SC2086
          python3 passport.py permit $IMAGE_ARG --report trivy.json \
            --stage-report sca=trivy-sca.json --stage-report sca=depcheck.json \
            --stage-report secrets=gitleaks.json --stage-report sast=semgrep.json \
            --stage-report iac=checkov.json

      - name: Keep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-passport
          path: |
            trivy.json
            trivy-sca.json
            gitleaks.json
            semgrep.json
            checkov.json
            passport.jwt
          if-no-files-found: ignore

  # Deploy only what holds a passport: see runtime/deploy-gate/github-deploy-job.yml
